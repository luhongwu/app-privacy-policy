<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "BoboBru" }}</title>
  <style>
    body { max-width: 800px; margin: 0 auto; padding: 24px 16px;
           font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
           line-height: 1.8; color: #24292f; }
    [dir="rtl"] { text-align: right; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #d0d7de; padding: 6px 12px; }
    a { color: #0969da; }
    img { max-width: 100%; }
    blockquote { margin-inline-start: 0; padding-inline-start: 16px;
                 border-inline-start: 4px solid #d0d7de; color: #57606a; }
  </style>
</head>
<body>{{ content }}</body>
</html>
